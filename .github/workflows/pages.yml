# Builds the site whenever main changes (or on demand from the Actions tab) and puts the built files on the
# gh-pages branch, which GitHub Pages publishes.
# One-time setup: Settings > Pages > Build and deployment > Source: Deploy from a branch,
# Branch: gh-pages, Folder: / (root).
# Pages only serves files, so the booking and question forms hand requests to WhatsApp or email.
name: Build site for GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Work out the Pages address from the repository
        run: |
          echo "VITE_BASE=/${{ github.event.repository.name }}/" >> "$GITHUB_ENV"
          owner="${{ github.repository_owner }}"
          echo "VITE_SITE_URL=https://${owner,,}.github.io/${{ github.event.repository.name }}" >> "$GITHUB_ENV"
      - run: npm run build:pages
      - name: Put the built site on the gh-pages branch
        working-directory: dist-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Built site from main ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" gh-pages

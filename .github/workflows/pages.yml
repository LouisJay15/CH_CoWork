# Publishes the site to GitHub Pages whenever main changes (or on demand from the Actions tab).
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
# Pages only serves files, so the booking and question forms hand requests to WhatsApp or email.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Work out the Pages address from the repository
        run: |
          echo "VITE_BASE=/${{ github.event.repository.name }}/" >> "$GITHUB_ENV"
          owner="${{ github.repository_owner }}"
          echo "VITE_SITE_URL=https://${owner,,}.github.io/${{ github.event.repository.name }}" >> "$GITHUB_ENV"
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
